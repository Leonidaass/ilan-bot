name: ilan-bot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test modu (ilk ilanı analiz edip gönderir)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ilan-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install DrissionPage google-genai requests
      - run: python bot.py
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SEARCH_URLS: ${{ secrets.SEARCH_URLS }}
          TEST_MODU: ${{ inputs.test }}
      - name: seen.json kaydet
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add seen.json || true
          git diff --staged --quiet || (git commit -m "update" && git push)
